<!doctype html>
<html lang="en" data-theme="light" data-roadmap-standalone>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpecterStudio — Program Status</title>
    <!--
      /app.css is the application's own stylesheet, served verbatim from
      app/renderer/styles/global.css. Loading it rather than copying its tokens is what keeps this
      page visually identical to AWKIT permanently, with no drift. dashboard.css must load after
      it: it overrides two rules that assume an Electron window.
    -->
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <div id="root">
      <div class="app-shell rm-shell">
        <!-- Structure mirrors app/renderer/layout/LeftNavigation.tsx so the app's own rules apply. -->
        <nav class="left-navigation" aria-label="Primary">
          <div class="brand-block">
            <div class="brand-tile">
              <svg
                class="brand-app-icon"
                width="32"
                height="32"
                viewBox="0 0 1024 1024"
                aria-hidden="true"
                focusable="false"
              >
                <defs>
                  <linearGradient id="sp-roadmap" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#7cc7ff" />
                    <stop offset="50%" stop-color="#b98cff" />
                    <stop offset="100%" stop-color="#ff8fa3" />
                  </linearGradient>
                  <clipPath id="sq-roadmap">
                    <path
                      d="M512 0 C880 0 1024 144 1024 512 C1024 880 880 1024 512 1024 C144 1024 0 880 0 512 C0 144 144 0 512 0 Z"
                    />
                  </clipPath>
                </defs>
                <g clip-path="url(#sq-roadmap)">
                  <rect x="0" y="0" width="1024" height="1024" fill="#0f0f0f" />
                  <g transform="translate(302,272) scale(1.4)">
                    <rect x="0" y="0" width="130" height="150" rx="20" fill="#f6f6f6" />
                    <path d="M160 0 H225 Q300 0 300 75 Q300 150 225 150 H160 Z" fill="#f6f6f6" />
                    <path d="M75 190 H140 V340 H75 Q0 340 0 265 Q0 190 75 190 Z" fill="url(#sp-roadmap)" />
                    <rect x="170" y="190" width="130" height="150" rx="20" fill="#f6f6f6" />
                  </g>
                </g>
              </svg>
              <span class="brand-name">
                <span>SpecterStudio</span>
                <small class="rm-brand-sub">Program Status</small>
              </span>
            </div>
          </div>

          <div class="navigation-list" id="rm-nav"></div>

          <div class="nav-footer rm-nav-footer">
            <button type="button" class="rm-button rm-button-primary rm-package-button" id="rm-package-portable">
              Generate next portable EXE
            </button>
            <span class="rm-release-target" id="rm-release-target" role="status" aria-live="polite"></span>
            <span class="rm-build-status" id="rm-build-status" role="status" aria-live="polite"></span>
            <button type="button" class="nav-item rm-theme-toggle" id="rm-theme">
              <span class="rm-icon" id="rm-theme-icon" aria-hidden="true"></span>
              <span id="rm-theme-label">System theme</span>
            </button>
            <p class="rm-live" id="rm-live" data-state="connecting">
              <span class="rm-live-dot" aria-hidden="true"></span>
              <span id="rm-live-label">Connecting…</span>
            </p>
          </div>
        </nav>

        <main class="app-main">
          <header class="top-header rm-header">
            <div class="rm-header-title">
              <h1 id="rm-title">Overview</h1>
              <p id="rm-subtitle">Reading the repository…</p>
            </div>
            <div class="rm-header-actions">
              <label class="rm-search" for="rm-filter">
                <span class="rm-icon rm-search-icon" aria-hidden="true"></span>
                <input
                  type="search"
                  id="rm-filter"
                  placeholder="Filter by title, id or area…"
                  autocomplete="off"
                  spellcheck="false"
                />
              </label>
              <span class="rm-freshness" id="rm-freshness" title="When this snapshot was built">—</span>
              <button type="button" class="rm-button" id="rm-refresh">Refresh</button>
            </div>
          </header>

          <section class="page rm-page" id="rm-view" tabindex="-1">
            <div class="rm-boot">Reading the repository…</div>
          </section>

          <footer class="rm-status-bar" id="rm-status">—</footer>
        </main>
      </div>
    </div>

    <script type="module" src="/dashboard.js"></script>
  </body>
</html>
