<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Visual Fusion Calibration Lab</title>
    <!--
      Phase N, N2.3 (awkit-vra.12.3) Visual Fusion Calibration Lab. An icon-only toolbar of four same-size buttons that
      share role, accessible name and ancestry, so only their icons tell them apart: the case DOM + Vision fusion exists
      for. window.__fusionLab.setState({ scenario, target, style }) redraws it deterministically:
        baseline          the remembered state; the reference is captured from button `target`
        restyle-selected  F1: only the target changes look (inverted, selected); it is still the right button
        restyle-pressed   F1: only the target changes look (darker, inset ring); it is still the right button
        swap              F2: the target's icon is swapped with its right-hand neighbour, so the button in the
                          remembered position is now wrong and a competitor carries the remembered icon
        twins             F3: every button carries the target's icon (true twins)
        theme-dark        F4: page-wide restyle, every button at once
        theme-contrast    F4: page-wide restyle, every button at once
        drift             N3.2: only the target's DOM identity changes (accessible name "Delete selected item", an id
                          and data-drift), so DOM scoring drops below its threshold while the pixels stay exactly
                          the remembered ones; the data-testid stays so a harness can still address it
      setState({ wide: true }) also shows vf-wide-toolbar (92,470): nine 48x40 buttons vf-wide-tool-0..8 with nine
      distinct icons (in `twins`, all carry vf-wide-tool-0's icon), the target plus 8 competitors of N3 VR-4.
      F5 (protected surface) uses injectProtected(kind); F6 (offscreen) uses the vf-offscreen-tool copy below the
      fold; F7 uses the ?embed=1 frame copy, the ?popup=1 popup and a different device scale factor; F8 is fusion off.
      N5.3 (awkit-vra.14.3) Visual Failure Diagnosis states, setFailure(kind), applied on top of the scenario:
        none     no failure state (the default)
        detach   the target button is removed from the DOM (target-not-in-dom)
        overlay  vf-overlay covers the target, so elementFromPoint at its centre is the overlay (target-occluded)
        zero     the target has no size (target-zero-size)
        blank    the toolbar is emptied and the body hidden, a uniform white viewport with no target (viewport-uniform)
        many     vf-many-grid (20,340) shows forty 48x40 buttons vf-many-tool (same test id, data-index 0..39), more
                 than the 32-member examined cap, all inside the viewport. Buttons 0..31 cycle eight icons; 32..39 carry a
                 ninth icon used nowhere in 0..31, so an element past the cap has no twin inside it
      N5.7 (awkit-vra.14.7, QC findings 1 and 2) states, each with nothing covering its target:
        shadow   vf-shadow-host (420,180) holds an OPEN shadow root with one 48x40 button vf-shadow-tool; document-level
                 elementFromPoint returns the host, the shadow root's returns the button (not target-occluded)
        partial  vf-partial-tool (420,584), 48x40: half below the 600 px fold, its centre off screen, its visible part
                 uncovered (not target-occluded, not target-offscreen)
        hidden   the target is display:none, so it has no box and no position (target-zero-size only, never offscreen)
      Nothing is random or time-dependent and the page carries no credential field. Sized for an 800x600 viewport.
      Measured by npm run benchmark:visual-fusion and npm run benchmark:visual-agreement; served by npm run
      verify:mock-site.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; }
      body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #111111; width: 800px; height: 3200px; position: relative; overflow-x: hidden; }
      h1 { position: absolute; left: 100px; top: 20px; margin: 0; font-size: 18px; line-height: 24px; }
      .vf-toolbar { position: absolute; left: 92px; top: 112px; width: 264px; height: 56px; background: #f1f5f9; border-radius: 8px; }
      .vf-toolbar[data-theme="theme-dark"] { background: #020617; }
      .vf-toolbar[data-theme="theme-contrast"] { background: #000000; }
      .vf-tool { position: absolute; top: 8px; box-sizing: border-box; width: 48px; height: 40px; padding: 0; border: 1px solid; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .vf-tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .vf-style-a { background: #2563eb; border-color: #1d4ed8; color: #ffffff; }
      .vf-style-b { background: #475569; border-color: #334155; color: #ffffff; }
      .vf-style-c { background: #0f766e; border-color: #115e59; color: #ffffff; }
      .vf-toolbar[data-theme="theme-dark"] .vf-tool { background: #1e293b; border-color: #334155; color: #e2e8f0; }
      .vf-toolbar[data-theme="theme-contrast"] .vf-tool { background: #000000; border-color: #facc15; color: #facc15; }
      .vf-tool.vf-selected { background: #ffffff; border-width: 2px; }
      .vf-style-a.vf-selected { color: #2563eb; border-color: #2563eb; }
      .vf-style-b.vf-selected { color: #475569; border-color: #475569; }
      .vf-style-c.vf-selected { color: #0f766e; border-color: #0f766e; }
      .vf-tool.vf-pressed { filter: brightness(0.72); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.55); }
      .vf-wide { position: absolute; left: 92px; top: 470px; width: 584px; height: 56px; background: #f1f5f9; border-radius: 8px; }
      .vf-wide[hidden] { display: none; }
      .vf-offscreen { position: absolute; left: 100px; top: 3000px; width: 64px; height: 56px; }
      .vf-offscreen .vf-tool { left: 8px; }
      .vf-frame { position: absolute; left: 92px; top: 260px; width: 280px; height: 72px; border: 0; }
      .vf-many { position: absolute; left: 20px; top: 340px; width: 640px; height: 192px; }
      .vf-many[hidden] { display: none; }
      .vf-overlay { position: absolute; width: 48px; height: 40px; background: #fde68a; z-index: 5; }
      .vf-tool.vf-zero { width: 0; height: 0; border-width: 0; overflow: hidden; }
      body.vf-blank { visibility: hidden; }
      .vf-open-popup { position: absolute; left: 420px; top: 120px; height: 36px; padding: 0 14px; font: 14px Arial, Helvetica, sans-serif; border: 1px solid #334155; border-radius: 4px; background: #e2e8f0; color: #0f172a; cursor: pointer; }
      body.vf-embed { width: auto; height: auto; }
      body.vf-embed .vf-toolbar { left: 8px; top: 8px; }
      body.vf-embed h1, body.vf-embed .vf-frame, body.vf-embed .vf-open-popup, body.vf-embed .vf-offscreen, body.vf-embed .vf-wide { display: none; }
    </style>
  </head>
  <body>
    <h1 data-testid="vf-title">Visual Fusion Calibration Lab</h1>
    <div class="vf-toolbar" data-testid="vf-toolbar" role="toolbar" aria-label="Item actions"></div>
    <button type="button" class="vf-open-popup" data-testid="vf-open-popup" onclick="window.open('/visual-intelligence/fusion?popup=1', 'visual-fusion-popup', 'width=400,height=300')">Open toolbar popup</button>
    <iframe class="vf-frame" data-testid="vf-frame" title="Toolbar frame copy"></iframe>
    <!-- F6: a copy of the target far below the fold. A capture must refuse it, never scroll to it. -->
    <div class="vf-offscreen" data-testid="vf-offscreen"></div>
    <!-- N3.2: a nine-button toolbar for the 8-competitor capture cost, hidden unless setState({ wide: true }). -->
    <div class="vf-wide" data-testid="vf-wide-toolbar" role="toolbar" aria-label="More item actions" hidden></div>
    <!-- N5.3: forty same-test-id buttons for the examined-cap (truncation) state, hidden unless setFailure("many"). -->
    <div class="vf-many" data-testid="vf-many-grid" hidden></div>

    <script>
      const ICONS = {
        trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
        archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/>',
        flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
        pin: '<path d="M12 21s-6-6.5-6-11a6 6 0 0 1 12 0c0 4.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',
        star: '<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/>',
        bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
        home: '<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        check: '<path d="M5 12l5 5 9-10"/>'
      };
      const ORDER = ["trash", "archive", "flag", "pin"];
      const WIDE_ORDER = ["trash", "archive", "flag", "pin", "star", "bell", "home", "plus", "check"];
      const SCENARIOS = ["baseline", "restyle-selected", "restyle-pressed", "swap", "twins", "theme-dark", "theme-contrast", "drift"];
      const STYLES = ["a", "b", "c"];
      const params = new URLSearchParams(location.search);
      const embedded = params.has("embed");
      if (embedded) document.body.classList.add("vf-embed");

      function button(testId, icon, style, extra) {
        return '<button type="button" class="vf-tool vf-style-' + style + (extra ? " " + extra : "") + '" data-testid="' + testId +
          '" data-icon="' + icon + '" aria-label="Item action"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[icon] + "</svg></button>";
      }

      let current = { scenario: "baseline", target: 0, style: "a", wide: false };
      const FAILURES = ["none", "detach", "overlay", "zero", "blank", "many", "shadow", "partial", "hidden"];
      let failure = "none";

      // N5.3: a failure state drawn over the current scenario; "none" leaves the scenario exactly as render() drew it.
      function applyFailure() {
        if (embedded) return;
        for (const node of document.querySelectorAll(".vf-overlay, [data-testid='vf-shadow-host'], [data-testid='vf-partial-tool']")) node.remove();
        if (failure === "shadow") {
          const host = document.createElement("div");
          host.setAttribute("data-testid", "vf-shadow-host");
          host.style.cssText = "position: absolute; left: 420px; top: 180px; width: 64px; height: 56px";
          // Page styles do not reach into a shadow root, so the button carries its own.
          host.attachShadow({ mode: "open" }).innerHTML = button("vf-shadow-tool", ORDER[current.target], current.style, "")
            .replace("<button ", '<button style="position: absolute; left: 8px; top: 8px; box-sizing: border-box; width: 48px; height: 40px; padding: 0; border: 1px solid #1d4ed8; border-radius: 6px; background: #2563eb; color: #ffffff" ');
          document.body.appendChild(host);
        }
        if (failure === "partial") {
          const holder = document.createElement("div");
          holder.innerHTML = button("vf-partial-tool", ORDER[current.target], current.style, "").replace("<button ", '<button style="left: 420px; top: 584px" ');
          document.body.appendChild(holder.firstElementChild);
        }
        document.body.classList.toggle("vf-blank", failure === "blank");
        const grid = document.querySelector("[data-testid='vf-many-grid']");
        grid.hidden = failure !== "many";
        grid.innerHTML = failure !== "many" ? "" : Array.from({ length: 40 }, (_, i) =>
          button("vf-many-tool", i < 32 ? WIDE_ORDER[i % 8] : WIDE_ORDER[8], current.style, "")
            .replace("<button ", '<button data-index="' + i + '" style="left: ' + ((i % 10) * 64) + 'px; top: ' + (Math.floor(i / 10) * 48) + 'px" ')
        ).join("");
        const toolbar = document.querySelector("[data-testid='vf-toolbar']");
        const target = document.querySelector("[data-testid='vf-tool-" + current.target + "']");
        if (failure === "detach" && target) target.remove();
        if (failure === "zero" && target) target.classList.add("vf-zero");
        if (failure === "hidden" && target) target.style.display = "none";
        if (failure === "blank") toolbar.innerHTML = "";
        if (failure === "overlay") {
          const overlay = document.createElement("div");
          overlay.className = "vf-overlay";
          overlay.setAttribute("data-testid", "vf-overlay");
          overlay.style.left = (92 + 8 + current.target * 64) + "px";
          overlay.style.top = (112 + 8) + "px";
          document.body.appendChild(overlay);
        }
      }

      // N3.2 drift: the DOM identity changes and the pixels do not. The new name is an aria-label, which the browser
      // never paints (the icon is aria-hidden), and the id / data-drift attributes carry no style.
      function drift(markup) {
        return markup.replace('aria-label="Item action"', 'id="vf-drifted" data-drift="renamed" aria-label="Delete selected item"');
      }

      function render() {
        const { scenario, target, style, wide } = current;
        const icons = ORDER.slice();
        if (scenario === "swap") {
          const neighbour = (target + 1) % icons.length;
          [icons[target], icons[neighbour]] = [icons[neighbour], icons[target]];
        } else if (scenario === "twins") {
          icons.fill(ORDER[target]);
        }
        const toolbar = document.querySelector("[data-testid='vf-toolbar']");
        toolbar.dataset.theme = scenario.startsWith("theme-") ? scenario : "";
        toolbar.innerHTML = icons
          .map((icon, i) => {
            const extra = i !== target ? "" : scenario === "restyle-selected" ? "vf-selected" : scenario === "restyle-pressed" ? "vf-pressed" : "";
            const markup = button("vf-tool-" + i, icon, style, extra).replace("<button ", '<button style="left: ' + (8 + i * 64) + 'px" ');
            return scenario === "drift" && i === target ? drift(markup) : markup;
          })
          .join("");
        if (!embedded) document.querySelector("[data-testid='vf-offscreen']").innerHTML = button("vf-offscreen-tool", ORDER[target], style, "");
        const wideBar = document.querySelector("[data-testid='vf-wide-toolbar']");
        wideBar.hidden = !wide || embedded;
        wideBar.innerHTML = WIDE_ORDER
          .map((icon, i) => button("vf-wide-tool-" + i, scenario === "twins" ? WIDE_ORDER[0] : icon, style, "").replace("<button ", '<button style="left: ' + (8 + i * 64) + 'px" '))
          .join("");
        applyFailure();
      }

      window.__fusionLab = {
        interactions: 0,
        scenarios: SCENARIOS.slice(),
        styles: STYLES.slice(),
        icons: ORDER.slice(),
        setState(next) {
          const candidate = { ...current, ...(next || {}) };
          if (!SCENARIOS.includes(candidate.scenario)) throw new Error("unknown scenario");
          if (!STYLES.includes(candidate.style)) throw new Error("unknown style");
          if (!Number.isInteger(candidate.target) || candidate.target < 0 || candidate.target >= ORDER.length) throw new Error("unknown target");
          if (typeof candidate.wide !== "boolean") throw new Error("wide must be a boolean");
          current = candidate;
          render();
          const frame = document.querySelector("[data-testid='vf-frame']");
          frame?.contentWindow?.__fusionLab?.setState(current);
          return window.__fusionLab.describe();
        },
        failures: FAILURES.slice(),
        setFailure(kind) {
          if (!FAILURES.includes(kind)) throw new Error("unknown failure");
          failure = kind;
          render();
          return window.__fusionLab.describe();
        },
        describe() {
          return {
            ...current,
            failure,
            icons: [...document.querySelectorAll("[data-testid='vf-toolbar'] .vf-tool")].map((node) => node.dataset.icon),
            names: [...document.querySelectorAll("[data-testid='vf-toolbar'] .vf-tool")].map((node) => node.getAttribute("aria-label")),
            wideIcons: [...document.querySelectorAll("[data-testid='vf-wide-toolbar'] .vf-tool")].map((node) => node.dataset.icon)
          };
        },
        // A protected surface of each kind visual capture must refuse, added on demand so the page itself stays
        // unprotected.
        injectProtected(kind) {
          window.__fusionLab.removeProtected();
          const box = document.createElement("div");
          box.setAttribute("data-testid", "vf-protected-" + kind);
          box.className = "vf-protected";
          box.style.cssText = "position: absolute; left: 420px; top: 400px; width: 180px; height: 50px";
          if (kind === "otp") box.innerHTML = "<input autocomplete='one-time-code' inputmode='numeric'>";
          else if (kind === "mfa") box.innerHTML = "<input aria-label='Verification code'>";
          else if (kind === "captcha") box.innerHTML = "<div class='g-recaptcha' data-sitekey='lab-only'></div>";
          else if (kind === "passkey") box.innerHTML = "<button type='button' aria-label='Use a passkey'>Continue</button>";
          else throw new Error("unknown protected kind");
          document.body.appendChild(box);
        },
        removeProtected() {
          for (const node of document.querySelectorAll(".vf-protected")) node.remove();
        }
      };
      render();
      if (!embedded) {
        const frame = document.querySelector("[data-testid='vf-frame']");
        frame.addEventListener("load", () => frame.contentWindow.__fusionLab?.setState(current));
        frame.src = "/visual-intelligence/fusion?embed=1";
      }
      // Interaction counter: a visual capture must never click, focus or scroll the page.
      for (const type of ["click", "mousedown", "keydown", "focusin", "scroll"]) {
        window.addEventListener(type, () => { window.__fusionLab.interactions += 1; }, true);
      }
    </script>
  </body>
</html>
