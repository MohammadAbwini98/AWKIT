<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shared report title</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>J4 — Alpha report</h1>
      <p>
        This page's <code>&lt;title&gt;</code> is identical to <code>same-title-beta.html</code>.
        Only the path distinguishes them, so page identity must not be derived from the title.
      </p>
      <p data-testid="same-title-alpha-marker">same-title-alpha-loaded</p>
      <button
        id="same-title-alpha-action"
        data-testid="same-title-alpha-action"
        onclick="document.querySelector('[data-testid=same-title-alpha-result]').textContent = 'alpha-clicked'"
      >Confirm in Alpha</button>
      <p data-testid="same-title-alpha-result" role="status">idle</p>
    </main>
  </body>
</html>
