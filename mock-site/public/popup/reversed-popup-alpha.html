<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Alpha popup — reversed-order scenario</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1 data-testid="alpha-heading">Alpha popup</h1>
      <p>
        Stable identity marker for the reversed-order scenario. This page is always reachable at
        <code>/popup/reversed-popup-alpha.html</code>, whether it opened first or second.
      </p>
      <p data-testid="alpha-marker">alpha</p>
      <button id="alpha-action-button" data-testid="alpha-action-button">Alpha action</button>
      <div id="alpha-status" data-testid="alpha-status" style="margin-top:16px; font-weight:bold;"></div>
      <script>
        document.getElementById("alpha-action-button").addEventListener("click", function () {
          document.getElementById("alpha-status").textContent = "alpha action done";
          try {
            if (window.opener) window.opener.postMessage({ type: "popup-action", which: "alpha" }, "*");
          } catch (e) { /* opener gone */ }
        });
      </script>
    </main>
  </body>
</html>
